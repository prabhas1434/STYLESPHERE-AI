<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Wear | STYLESPHERE AI</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
body{
  background:#000;
  color:white;
  overflow-x:hidden;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
  background:#000;
  border-bottom:1px solid #111;
}

nav a{
  color:#ffd700;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(135deg,#000,#111,#1a1a1a);
}

.hero h1{
  font-size:50px;
  background:linear-gradient(90deg,#fff,#00ffea,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:15px;
  color:#aaa;
}

.grid{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:60px;
  flex-wrap:wrap;
}

.card{
  width:250px;
  height:350px;
  background:#111;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:0.4s ease;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-15px);
  box-shadow:0 0 25px rgba(0,255,234,0.4);
}

.card span{
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<nav>
<h2>STYLESPHERE AI</h2>
<a href="new.html">← Back</a>
</nav>

<section class="hero">
<h1>Street Wear Collection</h1>
<p>Urban Energy. Bold Expression. Real Confidence.</p>
</section>

<section class="grid">
<div class="card"><span>Oversized Hoodies</span></div>
<div class="card"><span>Sneakers</span></div>
<div class="card"><span>Cargo Pants</span></div>
<div class="card"><span>Graphic Tees</span></div>
</section>

</body>
</html>
