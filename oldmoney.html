<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Money | STYLESPHERE AI</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
body{
  background:#0b0f0c;
  color:white;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
  background:#0b0f0c;
  border-bottom:1px solid #1e2a24;
}

nav a{
  color:#d4af37;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(135deg,#0b0f0c,#1c2b24);
}

.hero h1{
  font-size:50px;
  color:#d4af37;
}

.hero p{
  margin-top:15px;
  color:#ccc;
}

.grid{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:60px;
  flex-wrap:wrap;
}

.card{
  width:250px;
  height:350px;
  background:#111;
  border:1px solid #d4af37;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:0.4s ease;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-15px);
  box-shadow:0 0 25px rgba(212,175,55,0.4);
}

.card span{
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<nav>
<h2>STYLESPHERE AI</h2>
<a href="new.html">← Back</a>
</nav>

<section class="hero">
<h1>Old Money Collection</h1>
<p>Luxury. Heritage. Timeless Elegance.</p>
</section>

<section class="grid">
<div class="card"><span>Blazers</span></div>
<div class="card"><span>Loafers</span></div>
<div class="card"><span>Tailored Pants</span></div>
<div class="card"><span>Wool Coats</span></div>
</section>

</body>
</html>
